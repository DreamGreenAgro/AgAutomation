<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Farm Market Upload</title>
    <style>
        :root {
            --primary: #188f1d;
            --bg: #f1f8e9;
            --whatsapp: #25D366;
            --whatsapp-hover: #128C7E;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px 15px 50px 15px; /* Added bottom padding to body */
            color: #333;
        }
        .form-container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin: 0 auto 30px auto;
            box-sizing: border-box;
        }
        h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #555;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fafafa;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            background-color: white;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .col {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0d270e;
        }

        /* WhatsApp Section Styling */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #777;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 25px 0 20px 0;
            text-transform: uppercase;
            clear: both;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #4d1818;
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }
        .whatsapp-btn {
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: var(--whatsapp);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .whatsapp-btn:hover {
            background-color: var(--whatsapp-hover);
        }
        .whatsapp-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🧑‍🌾 List Your Harvest</h2>
    
    <form action="/submit_farmer" method="POST">
        
        <div class="section-title">1. About Your Farm</div>
        
        <label for="farm_name">Farm or Enterprise Name</label>
        <input type="text" id="farm_name" name="farm_name" placeholder="e.g., DGAgroo Farm" required>

        <div class="row">
            <div class="col">
                <label for="location_city">Nearest Market Hub/City</label>
                <select id="location_city" name="location_city" required>
                    <option value="Chegutu">Chegutu</option>
                    <option value="Harare">Harare</option>
                    <option value="Chinhoyi">Chinhoyi</option>
                    <option value="Marondera">Marondera</option>
                </select>
            </div>
        </div>

        <label for="map_pin">Google Maps Link 
        (Optional)</label>
        <input type="text" id="map_pin" name="map_pin" placeholder="Paste link or leave blank">

        <label for="directions_intel">Simple Driving Directions</label>
        <textarea id="directions_intel" name="directions_intel" placeholder="e.g., Turn right at the Chicken Slice along the highway..."></textarea>

        <div class="section-title">2. Crop Details & How You Want to Sell</div>

        <label for="crop_type">What Crop are you selling?</label>
        <select id="crop_type" name="crop_type" required>
            <option value="Onions">Onions</option>
            <option value="Groundnuts">Groundnuts</option>
            <option value="Maize">Maize</option>
            <option value="Potatoes">Potatoes</option>
            <option value="Tomatoes">Tomatoes</option>
        </select>

        <div class="row">
            <div class="col" style="flex: 1.5;">
                <label for="expected_yield">How much do you have?</label>
                <input type="number" id="expected_yield" name="expected_yield" placeholder="Amount (e.g., 150)" required step="any">
            </div>
            <div class="col" style="flex: 1;">
                <label for="yield_unit">Unit Measure</label>
                <select id="yield_unit" name="yield_unit" required>
                    <option value="Square Meters">Sq Meters (Field)</option>
                    <option value="Bags">Bags</option>
                    <option value="Crates">Crates</option>
                    <option value="Tons">Tons</option>
                    <option value="Hectares">Hectares</option>
                </select>
            </div>
        </div>

        <label for="sale_condition">How do you want to hand it over?</label>
        <select id="sale_condition" name="sale_condition" required>
            <option value="Buy directly from the field (Buyer harvests/pulls)">Buyer must harvest directly from my field</option>
            <option value="Pre-packed at farm gate (Ready for pickup)">Pre-packed at farm gate (Ready for pickup)</option>
            <option value="Flexible / Open to negotiate with buyer">Open to negotiate terms with buyer</option>
        </select>

        <div class="row">
            <div class="col">
                <label for="expected_date">Ready Date</label>
                <input type="date" id="expected_date" name="expected_date" required>
            </div>
            <div class="col">
                <label for="growth_stage">Current Stage</label>
                <select id="growth_stage" name="growth_stage" required>
                    <option value="Near Maturity">Near Maturity</option>
                    <option value="Freshly Planted">Freshly Planted</option>
                    <option value="Mid-Growth">Mid-Growth</option>
                    <option value="Harvested & Stored">Harvested & Stored</option>
                </select>
            </div>
        </div>

        <button type="submit">Broadcast to Buyers 🚀</button>
    </form>

    <!-- Visual Separator -->
    <div class="divider">OR</div>

    <!-- WhatsApp Entry Action -->
    <a href="https://wa.me/917302598282?text=Hi%20I%20want%20to%20list%20my%20harvest" 
       target="_blank" 
       class="whatsapp-btn">
       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24" style="flex-shrink: 0; display: block;">
           <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
       </svg>
       List via WhatsApp Bot
    </a>
</div>

</body>
</html>
